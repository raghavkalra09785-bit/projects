<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Track and manage your daily expenses</p>
        </header>

        <div class="main-content">
            <!-- Add Expense Section -->
            <section class="add-expense-section">
                <h2>Add New Expense</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Groceries, Gas" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transport</option>
                            <option value="Entertainment">🎬 Entertainment</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Bills">📄 Bills</option>
                            <option value="Health">⚕️ Health</option>
                            <option value="Education">📚 Education</option>
                            <option value="Other">📍 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn-add">Add Expense</button>
                </form>
            </section>

            <!-- Summary Section -->
            <section class="summary-section">
                <div class="summary-card">
                    <h3>Total Expenses</h3>
                    <p class="total-amount" id="totalAmount">$0.00</p>
                </div>
                <div class="summary-card">
                    <h3>Number of Expenses</h3>
                    <p class="count" id="expenseCount">0</p>
                </div>
                <div class="summary-card">
                    <h3>Average Expense</h3>
                    <p class="average" id="averageAmount">$0.00</p>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <h2>Filter Expenses</h2>
                <div class="filter-controls">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Bills">📄 Bills</option>
                        <option value="Health">⚕️ Health</option>
                        <option value="Education">📚 Education</option>
                        <option value="Other">📍 Other</option>
                    </select>
                    <input type="month" id="monthFilter">
                    <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
                </div>
            </section>

            <!-- Expenses List Section -->
            <section class="expenses-section">
                <h2>Your Expenses</h2>
                <div class="expenses-controls">
                    <button class="btn-export" onclick="exportToCSV()">📥 Export to CSV</button>
                    <button class="btn-clear" onclick="clearAllExpenses()">🗑️ Clear All</button>
                </div>
                <div id="expensesList" class="expenses-list">
                    <p class="no-expenses">No expenses yet. Add one to get started!</p>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
